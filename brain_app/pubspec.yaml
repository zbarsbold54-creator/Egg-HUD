name: brain_app
description: "JARVIS Glasses OS — Brain App. Central orchestrator for HUD Egg (ESP32-C3 + SSD1309 128x64), Hermes via Home Assistant, cross-platform Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Persistence
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  # Networking
  web_socket_channel: ^3.0.3
  http: ^1.3.0
  multicast_dns: ^0.3.2

  # Speech
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3

  # Platform info
  sensors_plus: ^6.1.2
  geolocator: ^14.0.1

  audioplayers: ^6.1.0

  # Chess rules
  chess: ^0.8.1

  # Utilities
  intl: ^0.20.2
  collection: ^1.19.1

  # Background: foreground service for HUD WebSocket keep-alive (screen-off)
  flutter_foreground_task: ^9.1.0
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  mockito: ^5.4.6
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
